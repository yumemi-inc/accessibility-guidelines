name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install, build
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6

      - name: Run lint
        run: pnpm run lint
