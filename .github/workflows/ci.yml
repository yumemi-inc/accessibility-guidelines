name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install, build
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6

      - name: Run lint
        run: pnpm run lint
