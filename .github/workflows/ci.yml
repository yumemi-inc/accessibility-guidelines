name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install, build
        uses: withastro/action@9811f9299d5d37ca0416ca85cee333c7c9485cd1 # v5

      - name: Run lint
        run: pnpm run lint
